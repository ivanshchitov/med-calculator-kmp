<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#2F6BFF">
    <meta name="description" content="Расчёт педиатрических дозировок лекарств">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MedCalculator">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <style>
        :root {
            --app-height: 100dvh;
            --app-background: #F6F7FB;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--app-background);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #app {
            box-sizing: border-box;
            width: 100%;
            height: var(--app-height);
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            overflow: hidden;
            background: var(--app-background);
        }

        #app canvas {
            touch-action: none;
        }

        /* Compose uses a hidden textarea for IME. Safari zooms when it is smaller than 16px. */
        textarea, input {
            font-size: 16px !important;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="shared.js"></script>
<script>
    (function () {
        const viewport = window.visualViewport;

        function updateAppHeight() {
            const height = viewport ? viewport.height : window.innerHeight;
            document.documentElement.style.setProperty("--app-height", height + "px");
        }

        updateAppHeight();
        if (viewport) {
            viewport.addEventListener("resize", updateAppHeight);
            viewport.addEventListener("scroll", updateAppHeight);
        }
        window.addEventListener("orientationchange", updateAppHeight);

        document.addEventListener("gesturestart", function (event) {
            event.preventDefault();
        }, { passive: false });

        if ("serviceWorker" in navigator &&
            (location.protocol === "https:" || location.hostname === "localhost")) {
            let refreshing = false;

            navigator.serviceWorker.addEventListener("controllerchange", function () {
                if (refreshing) {
                    return;
                }
                refreshing = true;
                window.location.reload();
            });

            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js").catch(function (error) {
                    console.error("Service worker registration failed", error);
                });
            });
        }
    })();
</script>
</body>
</html>
