    <style>
        :root {
            --app-height: 100%;
            --app-offset-top: 0px;
            --app-background: #F6F7FB;
        }

        /*
         * Keep html, body and #app on the same height variable. In an installed
         * iOS web app the layout viewport (100%) can be shorter than the height
         * reported to JS by visualViewport, so a percentage body would clip the
         * bottom of #app, including the primary button.
         */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: var(--app-height);
            overflow: hidden;
            background: var(--app-background);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #app {
            position: absolute;
            top: env(safe-area-inset-top, 0px);
            left: env(safe-area-inset-left, 0px);
            box-sizing: border-box;
            width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            /*
             * Compose sizes its canvas from clientHeight, which includes padding.
             * Never put padding on #app: the canvas would start after padding-top
             * and overflow the container by that amount, clipping the bottom bar.
             * Position the container itself inside the safe area instead.
             */
            height: calc(var(--app-height) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            transform: translateY(var(--app-offset-top));
            overflow: hidden;
            background: var(--app-background);
        }

        #app canvas {
            touch-action: none;
        }

        /*
         * Standalone iOS may expose a viewport that ends above the physical
         * screen bottom (the status-bar-sized strip stays outside it). The
         * home indicator lives in that strip, so do not reserve its inset twice.
         */
        html.viewport-truncated #app {
            height: calc(var(--app-height) - env(safe-area-inset-top, 0px));
        }

        /* Compose uses a hidden textarea for IME. Safari zooms when it is smaller than 16px. */
        textarea, input {
            font-size: 16px !important;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    /*
     * Compose 1.10.x checks document.activeElement before its second focus request.
     * The backing input lives in a shadow root, so document.activeElement is the host,
     * and Compose calls focus() again in requestAnimationFrame. On iOS 27 that second
     * request is not treated as user interaction and prevents the keyboard from opening.
     * See CMP-10825 and WebKit commit 64ee64bad41e5d511964c29b8ab00ee77269821a.
     */
    (function () {
        const nativeFocus = HTMLElement.prototype.focus;

        HTMLElement.prototype.focus = function (...args) {
            try {
                const root = this.getRootNode && this.getRootNode();
                const isBackingField =
                    (this.tagName === "TEXTAREA" || this.tagName === "INPUT") &&
                    root &&
                    root.host;

                if (isBackingField && root.activeElement === this) {
                    return;
                }
            } catch (error) {
                // Fall through to the native focus implementation.
            }

            return nativeFocus.apply(this, args);
        };
    })();
</script>
<script src="shared.js"></script>
<script>
    (function () {
        const viewport = window.visualViewport;

        let resizeFrame = 0;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const isStandalone = navigator.standalone === true;

        function updateAppHeight() {
            // iOS Safari keeps the layout viewport full height and only pans/resizes
            // the visual viewport. Android Chrome resizes the layout viewport itself.
            // Applying the visual-viewport workaround there double-shifts Compose.
            if (!isIOS || !viewport) {
                return;
            }

            document.documentElement.style.setProperty("--app-height", viewport.height + "px");
            document.documentElement.style.setProperty("--app-offset-top", viewport.offsetTop + "px");

            const screenBottom = viewport.offsetTop + viewport.height;
            document.documentElement.classList.toggle(
                "viewport-truncated",
                isStandalone && Math.round(window.screen.height - screenBottom) > 1
            );

            // Compose resizes its canvas on window.resize. visualViewport changes
            // do not fire that event, so the canvas would stay full height and
            // keep its old scroll viewport after the keyboard opens.
            cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(function () {
                window.dispatchEvent(new Event("resize"));
            });
        }

        if (isIOS) {
            updateAppHeight();
            if (viewport) {
                viewport.addEventListener("resize", updateAppHeight);
                viewport.addEventListener("scroll", updateAppHeight);
            }
            window.addEventListener("orientationchange", updateAppHeight);
        }

        document.addEventListener("gesturestart", function (event) {
            event.preventDefault();
        }, { passive: false });

        if ("serviceWorker" in navigator &&
            (location.protocol === "https:" || location.hostname === "localhost")) {
            let refreshing = false;

            navigator.serviceWorker.addEventListener("controllerchange", function () {
                if (refreshing) {
                    return;
                }
                refreshing = true;
                window.location.reload();
            });

            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js").catch(function (error) {
                    console.error("Service worker registration failed", error);
                });
            });
        }
    })();
</script>
</body>
