<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#2F6BFF">
    <meta name="description" content="Расчёт педиатрических дозировок лекарств">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MedCalculator">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <style>
        :root {
            --app-height: 100dvh;
            --app-offset-top: 0px;
            --app-background: #F6F7FB;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--app-background);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #app {
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            width: 100%;
            height: var(--app-height);
            transform: translateY(var(--app-offset-top));
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            overflow: hidden;
            background: var(--app-background);
        }

        #app canvas {
            touch-action: none;
        }

        /* Compose uses a hidden textarea for IME. Safari zooms when it is smaller than 16px. */
        textarea, input {
            font-size: 16px !important;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    /*
     * Compose 1.10.x checks document.activeElement before its second focus request.
     * The backing input lives in a shadow root, so document.activeElement is the host,
     * and Compose calls focus() again in requestAnimationFrame. On iOS 27 that second
     * request is not treated as user interaction and prevents the keyboard from opening.
     * See CMP-10825 and WebKit commit 64ee64bad41e5d511964c29b8ab00ee77269821a.
     */
    (function () {
        const nativeFocus = HTMLElement.prototype.focus;

        HTMLElement.prototype.focus = function (...args) {
            try {
                const root = this.getRootNode && this.getRootNode();
                const isBackingField =
                    (this.tagName === "TEXTAREA" || this.tagName === "INPUT") &&
                    root &&
                    root.host;

                if (isBackingField && root.activeElement === this) {
                    return;
                }
            } catch (error) {
                // Fall through to the native focus implementation.
            }

            return nativeFocus.apply(this, args);
        };
    })();
</script>
<script src="shared.js"></script>
<script>
    (function () {
        const viewport = window.visualViewport;

        let resizeFrame = 0;

        function updateAppHeight() {
            const height = viewport ? viewport.height : window.innerHeight;
            const offsetTop = viewport ? viewport.offsetTop : 0;
            document.documentElement.style.setProperty("--app-height", height + "px");
            document.documentElement.style.setProperty("--app-offset-top", offsetTop + "px");

            // Compose resizes its canvas on window.resize. visualViewport changes
            // do not fire that event, so the canvas would stay full height and
            // keep its old scroll viewport after the keyboard opens.
            cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(function () {
                window.dispatchEvent(new Event("resize"));
            });
        }

        updateAppHeight();
        if (viewport) {
            viewport.addEventListener("resize", updateAppHeight);
            viewport.addEventListener("scroll", updateAppHeight);
        }
        window.addEventListener("orientationchange", updateAppHeight);

        document.addEventListener("gesturestart", function (event) {
            event.preventDefault();
        }, { passive: false });

        if ("serviceWorker" in navigator &&
            (location.protocol === "https:" || location.hostname === "localhost")) {
            let refreshing = false;

            navigator.serviceWorker.addEventListener("controllerchange", function () {
                if (refreshing) {
                    return;
                }
                refreshing = true;
                window.location.reload();
            });

            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js").catch(function (error) {
                    console.error("Service worker registration failed", error);
                });
            });
        }
    })();
</script>
</body>
</html>
